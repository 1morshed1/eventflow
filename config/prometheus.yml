# Prometheus scrape config for EventFlow.
# Each app service exposes /metrics; relay and projector serve it on :9100.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: command-service
    static_configs:
      - targets: ["command-service:8080"]
  - job_name: query-service
    static_configs:
      - targets: ["query-service:8081"]
  - job_name: relay
    static_configs:
      - targets: ["relay:9100"]
  - job_name: projector
    static_configs:
      - targets: ["projector:9100"]
